services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: serviceflow-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
    ports:
      - "14333:1433"
    volumes:
      - serviceflow_sqlserver_data:/var/opt/mssql
    restart: 
      unless-stopped

  mailpit:
    image: axllent/mailpit:v1.30.0
    container_name: serviceflow-mailpit
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
    restart:
      unless-stopped

volumes:
  serviceflow_sqlserver_data: